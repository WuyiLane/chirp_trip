# Codemagic 配置：两个工作流——「iOS 未签名包」（macOS 机器）和「Android APK」（Linux 机器）。
# iOS 产物是未签名的 .ipa，下载后用 Sideloadly / 爱思助手 拿自己的 Apple ID 签名再装；Android 的 apk 直接装。
# Codemagic 网页上点 Start new build，在弹窗的 Workflow 下拉里选要跑哪个。
workflows:
  ios-unsigned:
    name: iOS 未签名包
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: 依赖
        script: flutter pub get
      # --no-codesign：不需要证书 / 描述文件，产物是未签名的 Runner.app
      - name: 编译（不签名）
        script: flutter build ios --release --no-codesign
      # .ipa 其实就是把 Runner.app 放进 Payload 目录再 zip
      - name: 打成 ipa
        script: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr chirp_trip.ipa Payload
    artifacts:
      - chirp_trip.ipa

  android-apk:
    name: Android APK
    # 安卓不用 macOS，Linux 机器更快
    instance_type: linux_x2
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: 依赖
        script: flutter pub get
      # 这个项目的 release 沿用 debug 签名（android/app/build.gradle.kts 里写着），
      # 所以不用配证书，出来的 apk 直接能装
      - name: 编译 release apk
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
