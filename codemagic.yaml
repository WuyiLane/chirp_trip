# Codemagic 配置：在云端 macOS 上编译「未签名」的 iOS 包（.ipa），
# 下载后用 Sideloadly / 爱思助手 拿自己的 Apple ID 签名装到手机上试玩。
# Codemagic 网页上选择这个仓库后会自动读到此文件，点 Start new build 选 ios-unsigned 即可。
workflows:
  ios-unsigned:
    name: iOS 未签名包
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: 依赖
        script: flutter pub get
      # --no-codesign：不需要证书 / 描述文件，产物是未签名的 Runner.app
      - name: 编译（不签名）
        script: flutter build ios --release --no-codesign
      # .ipa 其实就是把 Runner.app 放进 Payload 目录再 zip
      - name: 打成 ipa
        script: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr chirp_trip.ipa Payload
    artifacts:
      - chirp_trip.ipa
